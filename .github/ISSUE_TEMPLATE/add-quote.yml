name: Add a quote
description: Add a quote to Sahil’s public quotebook.
title: "[Quotebook] Add quote"
body:
  - type: markdown
    attributes:
      value: "Submit while signed in as sahilnpatel. Your quote will be added to the public quotebook automatically. The author is optional."
  - type: textarea
    id: quote
    attributes:
      label: Quote
      description: Paste the quote exactly as you want it to appear.
      placeholder: Your quote
    validations:
      required: true
  - type: input
    id: attribution
    attributes:
      label: Attribution
      description: Optional. Leave blank if no author is listed.
      placeholder: Author · Work
    validations:
      required: false
  - type: input
    id: source
    attributes:
      label: Source link
      description: Optional. Use a public HTTPS link.
      placeholder: https://example.com
    validations:
      required: false
