name: Deploy GitHub Pages

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish-site]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the current site
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Prepare the static site
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github
          rm -f _site/.gitignore
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
